name: release

on:
  schedule:
    # Runs at 0:00 and 12:00 UTC every day to publish a rolling `edge` image
    - cron: '0 */12 * * *'
  # Automatically push the image when releasing a version
  push:
    tags:
      - "v*"
  # Allow manually triggering the workflow for debugging
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release metadata
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            while IFS= read -r line; do
              echo "$line" >> "$GITHUB_ENV"
            done < <(./scripts/release.sh metadata "${{ github.ref_name }}")
          else
            echo "VERSION=edge" >> "$GITHUB_ENV"
            echo "IMAGE_TAGS=edge" >> "$GITHUB_ENV"
            echo "IS_TAG_BUILD=false" >> "$GITHUB_ENV"
          fi
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IS_TAG_BUILD=true" >> "$GITHUB_ENV"
          fi
          # Downcase the repository owner for GHCR / Docker compatibility
          OWNER="${{ github.repository_owner }}"
          echo "REPO_OWNER=${OWNER,,}" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]] && [ "${LATEST_TAG:-false}" = "true" ]; then
            echo "IMAGE_TAGS=${TAG} latest" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAGS=${TAG}" >> "$GITHUB_ENV"
          fi

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Release image to Docker Hub
        run: |
          make VERSION=${{ env.VERSION }} IMAGE_TAGS="${{ env.IMAGE_TAGS }}" \
            IMAGE_PREFIX=volcanosh \
            DOCKER_PLATFORMS="linux/amd64,linux/arm64" \
            BUILDX_OUTPUT_TYPE=registry \
            release

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release image to GitHub Container Registry
        run: |
          make VERSION=${{ env.VERSION }} IMAGE_TAGS="${{ env.IMAGE_TAGS }}" \
            IMAGE_PREFIX=ghcr.io/${{ env.REPO_OWNER }} \
            DOCKER_PLATFORMS="linux/amd64,linux/arm64" \
            BUILDX_OUTPUT_TYPE=registry \
            release

      - name: Generate release manifest
        if: env.IS_TAG_BUILD == 'true'
        run: |
          manifest_path="$(./scripts/release.sh generate-manifest "${{ env.TAG }}" "$RUNNER_TEMP")"
          echo "MANIFEST_PATH=$manifest_path" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        if: env.IS_TAG_BUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=()
          if [ "${{ env.PRERELEASE }}" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "${{ env.TAG }}" >/dev/null 2>&1; then
            gh release upload "${{ env.TAG }}" "${{ env.MANIFEST_PATH }}" --clobber
          else
            gh release create "${{ env.TAG }}" "${{ env.MANIFEST_PATH }}" "${prerelease_flag[@]}"
          fi

      - name: Logout from registries
        if: always()
        run: |
          docker logout
          docker logout ghcr.io
