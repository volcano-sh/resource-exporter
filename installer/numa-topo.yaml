apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-exporter
  namespace: volcano-system
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
  - apiGroups: ["nodeinfo.volcano.sh"]
    resources: ["numatopologies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-exporter-bind
subjects:
  - kind: ServiceAccount
    name: resource-exporter-account
    namespace: volcano-system
roleRef:
  kind: ClusterRole
  name: resource-exporter
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-exporter-account
  namespace: volcano-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: resource-exporter-daemonset
  namespace: volcano-system
spec:
  selector:
    matchLabels:
      name: resource-topology
  template:
    metadata:
      labels:
        name: resource-topology
    spec:
      serviceAccountName: resource-exporter-account
      containers:
        - name: resource-topology
          image: volcanosh/numatopo:latest
          imagePullPolicy: IfNotPresent
          args:
            - --logtostderr
            - --kubelet-conf=/host/kubeletconf/config.yaml
            - --cpu-manager-state=/host/kubelet/cpu_manager_state
            - --device-plugin-checkpoint=/host/kubelet/device-plugins/kubelet_internal_checkpoint
            - --device-path=/host/device
            - --pci-device-path=/host/sys/bus/pci/devices
            - --pod-resource-sock=/host/podresources
            - --enable-pod-resource=true
            - -v=4
            - 2>&1
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: node-path
              mountPath: "/host/device"
            # Whole host sysfs, read-only: /sys/bus/pci/devices entries are
            # relative symlinks into /sys/devices, so mounting only the
            # subdirectory would leave them dangling.
            - name: host-sys
              mountPath: "/host/sys"
              readOnly: true
            - name: kubelet-path
              mountPath: "/host/kubelet"
            - name: kubelet-config-path
              mountPath: "/host/kubeletconf"
            - name: pod-resources-sock
              mountPath: "/host/podresources"
              readOnly: true
      volumes:
        - name: node-path
          hostPath:
            path: "/sys/devices/system"
        - name: host-sys
          hostPath:
            path: "/sys"
        - name: kubelet-path
          hostPath:
            path: "/var/lib/kubelet"
        - name: kubelet-config-path
          hostPath:
            path: "/var/lib/kubelet"
        - name: pod-resources-sock
          hostPath:
            path: /var/lib/kubelet/pod-resources
